name: MLB Correlation & Discovery Sweep

on:
  workflow_dispatch:

jobs:
  run-correlation-sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests scikit-learn lightgbm pybaseball

      - name: Execute 1-Year Historical Backtest (Seed Database)
        run: python backtest_multiyr.py

      - name: Execute Open-Source Discovery Ingestion
        run: python open_source_discovery.py

      - name: Execute Full-Matrix Correlation Sweep
        run: python correlation_engine.py

      - name: Commit and Push Updated Database & Mutations
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the populated database and any autonomously mutated code files
          git add -A
          
          # Commit the historical backtest, correlation logs, and anomaly flags
          git commit -m "Auto-update database: 1-Year backtest & correlation sweep [skip ci]" || echo "No changes to commit"
          
          # Pull with autostash to prevent overwrite conflicts, then push
          git pull --rebase --autostash
          git push
