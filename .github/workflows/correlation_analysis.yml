name: MLB Correlation Analysis

on:
  workflow_dispatch:

jobs:
  analyze-discrepancies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Backtest (Database Hydration)
        run: python backtest_engine.py

      - name: Run Correlation Engine
        run: python correlation_engine.py

      - name: Commit and Push Updated Discrepancy Matrix
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mlb_engine.db
          git commit -m "Auto-update correlation anomalies and SOTA logs [skip ci]" || echo "No changes to commit"
          git pull --rebase --autostash
          git push
