name: Esoteric Feature Discovery & Correlation Matrix

on:
  schedule:
    # Diagnostic daily sweep at 10:00 AM UTC
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-correlation-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Purge Bytecode Cache
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          git rm -r --cached __pycache__ 2>/dev/null || true

      - name: Run Discovery Ingestion
        run: python open_source_discovery.py

      - name: Run High-Speed Correlation Matrix Sweeper
        run: python correlation_engine.py

      - name: Commit Feature Correlations
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          [ -f mlb_engine.db ] && git add mlb_engine.db
          # Fetch latest remote changes and align HEAD to prevent binary merge conflicts
git fetch origin main
git reset origin/main

# Stage generated database and markdown artifacts
[ -f README.md ] && git add README.md
[ -f PREDICTIONS_TODAY.md ] && git add PREDICTIONS_TODAY.md
[ -f F5_PREDICTIONS_TODAY.md ] && git add F5_PREDICTIONS_TODAY.md
[ -f mlb_engine.db ] && git add mlb_engine.db
[ -f mlb_forecasts_2026.csv ] && git add mlb_forecasts_2026.csv

if ! git diff-index --quiet HEAD; then
  git commit -m "Auto-update full-game, F5 props, README, and operational database [skip ci]"
  git push origin main
else
  echo "No changes to commit."
fi
