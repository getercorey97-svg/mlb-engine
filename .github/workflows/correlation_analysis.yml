name: MLB Correlation & Discovery Sweep

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  run-correlation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests scikit-learn lightgbm pybaseball

      - name: Execute Open-Source Discovery Ingestion
        run: python open_source_discovery.py

      - name: Execute Full-Matrix Correlation Sweep
        run: python correlation_engine.py

      - name: Commit and Push Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the database and any automatically mutated code files
          git add -A
          
          # Commit the correlation logs and anomaly flags
          git commit -m "Auto-update database with discovery sweep & correlation matrix [skip ci]" || echo "No changes to commit"
          
          # Pull with autostash to prevent overwrite conflicts, then push
          git pull --rebase --autostash
          git push
