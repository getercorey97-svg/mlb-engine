name: Seed Historical Data

on:
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

jobs:
  seed-database:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run Historical Seeding Script
        run: python seed_historical_data.py

      - name: Commit and Push Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mlb_engine.db
          git commit -m "Seed historical empirical MLB data [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
