name: Gemini AI Code Perfector

on:
  workflow_dispatch: # Allows you to trigger it manually
  push:
    branches:
      - main # Runs whenever you push to main

jobs:
  gemini-scan-and-fix:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Run Gemini AI Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python gemini_fixer.py

      - name: Create Pull Request with AI Fixes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Automated code fixes by Gemini AI"
          title: "🤖 AI Code Improvements (Gemini)"
          body: |
            Google Gemini has analyzed the recent code pushes and suggested these algorithmic/math improvements.
            
            **Please review the changes in the 'Files changed' tab before merging.**
          branch: gemini-auto-fixes
          base: main
