name: Dynamic Pre-Game Prop Ingestion (Every 15 Mins)

on:
  schedule:
    # Runs every 15 minutes from 16:00 UTC (12:00 PM EDT) through 05:45 UTC (1:45 AM EDT)
    - cron: '*/15 16-23,0-5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate-and-synthesize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests numpy pandas scipy
          fi

      - name: Evaluate Impending Game Windows
        id: gatekeeper
        run: |
          python pregame_gatekeeper.py
        continue-on-error: true

      - name: Ingest Confirmed Lineups & Calibrate Props
        if: steps.gatekeeper.outcome == 'success'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python lineup_verifier.py
          python engine_batter_props.py

      - name: Commit & Push Updated Database
        if: steps.gatekeeper.outcome == 'success'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset origin/main

          [ -f mlb_engine.db ] && git add mlb_engine.db
          [ -f PREDICTIONS_TODAY.md ] && git add PREDICTIONS_TODAY.md

          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-refresh pre-game lineups and hit props [skip ci]"
            git push origin main
          else
            echo "No changes to commit."
          fi
