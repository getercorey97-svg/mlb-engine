name: Unified MLB Engine Pipeline

on:
  schedule:
    # 06:00 UTC (2:00 AM EDT): Overnight post-mortem, completed linescore ingest, EWMA learning
    - cron: '0 6 * * *'
    # 15:00 UTC (11:00 AM EDT): Morning schedule ingest, probable starters, initial 50k Monte Carlo
    - cron: '0 15 * * *'
    # 19:30 UTC (3:30 PM EDT): Afternoon slate lineup verification & initial batter hit props
    - cron: '30 19 * * *'
    # 22:30 UTC (6:30 PM EDT): Main slate lineup lock, 270+ batter props & cross-market SGPs
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests urllib3 numpy pandas scipy scikit-learn xgboost fastapi uvicorn
          fi

      - name: Purge Bytecode Cache Before Run
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          git rm -r --cached __pycache__ 2>/dev/null || true

      - name: Run Unified Orchestration Pipeline
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python run_pipeline.py

      - name: Run Dedicated F5 & Pitcher Props Engine
        run: |
          if [ -f engine_f5_props.py ]; then
            python engine_f5_props.py
          elif [ -f engine_f5.py ]; then
            python engine_f5.py
          else
            echo "No standalone F5 script detected; handled inside run_pipeline.py"
          fi

      - name: Run Live Monitor & Send Alerts via ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -f live_monitor.py ]; then
            python live_monitor.py
          fi

      - name: Commit and Push Updated Database & Forecasts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true

          # Pull any remote code changes before staging database artifacts
          git fetch origin main
          git pull --rebase --autostash origin main || true

          # Stage documentation, operational database, and forecast outputs
          [ -f README.md ] && git add README.md
          [ -f PREDICTIONS_TODAY.md ] && git add PREDICTIONS_TODAY.md
          [ -f F5_PREDICTIONS_TODAY.md ] && git add F5_PREDICTIONS_TODAY.md
          [ -f mlb_engine.db ] && git add mlb_engine.db
          [ -f mlb_forecasts_2026.csv ] && git add mlb_forecasts_2026.csv

          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update full-game, F5 props, README, and operational database [skip ci]"
            git push origin main
          else
            echo "No changes to commit."
          fi
