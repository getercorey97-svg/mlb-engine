name: MLB Engine Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * *' # Runs daily at 11:30 AM EDT (Morning pipeline: Statcast & early pitchers)[span_3](start_span)[span_3](end_span)[span_4](start_span)[span_4](end_span)
    - cron: '0 21 * * *'  # Runs daily at 5:00 PM EDT (Evening pipeline: Night lineups & umpire assignments)

jobs:
  run-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Full Pipeline (Ingestion + Monte Carlo)
        run: python run_pipeline.py

      - name: Commit and Push Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update database with fresh pipeline ingestion and simulations [skip ci]" || echo "No changes to commit"
          git pull --rebase --autostash
          git push
