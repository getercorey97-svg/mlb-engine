name: MLB Engine Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '25 15 * * *' # Runs strictly once daily at 3:25 PM UTC (11:25 AM EDT)

jobs:
  run-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Full Pipeline (Ingestion + Monte Carlo)
        run: python run_pipeline.py

      - name: Commit and Push Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mlb_engine.db
          git commit -m "Auto-update database with fresh ingestion and simulations [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push

