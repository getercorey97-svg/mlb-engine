name: MLB Engine & Live Monitor Pipeline

on:
  schedule:
    # Runs across MLB slate windows: 15:00, 18:00, 21:00, 00:00, 03:00 UTC
    - cron: '0 15,18,21,0,3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Purge Bytecode Cache Before Run
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          git rm -r --cached __pycache__ 2>/dev/null || true

      - name: Run Unified Orchestration Pipeline
        run: python run_pipeline.py

      - name: Run Live Monitor & Send Alerts via ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python live_monitor.py

      - name: Commit and Push Updated Database & Forecasts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          git add PREDICTIONS_TODAY.md mlb_engine.db
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update forecasts and clean database [skip ci]"
            git pull --rebase --autostash
            git push origin main
          else
            echo "No changes to commit."
          fi
