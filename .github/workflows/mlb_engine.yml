name: MLB Engine & Live Monitor Pipeline

on:
  schedule:
    # Multiple slates: 15:00, 18:00, 21:00, 00:00, 03:00 UTC
    - cron: '0 15,18,21,0,3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests scikit-learn xgboost lightgbm pybaseball
          fi

      - name: Purge Bytecode Cache Before Run
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          git rm -r --cached __pycache__ 2>/dev/null || true

      - name: Run Unified Orchestration Pipeline
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python run_pipeline.py

      - name: Run Dedicated F5 & Pitcher Props Engine
        run: |
          if [ -f engine_f5_props.py ]; then
            python engine_f5_props.py
          elif [ -f engine_f5.py ]; then
            python engine_f5.py
          else
            echo "No standalone F5 script detected; handled inside run_pipeline.py"
          fi

      - name: Run Live Monitor & Send Alerts via ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -f live_monitor.py ]; then
            python live_monitor.py
          fi

      - name: Commit and Push Updated Database & Forecasts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          
          # Stage documentation, operational database, full-game, and F5 prop outputs
          [ -f README.md ] && git add README.md
          [ -f PREDICTIONS_TODAY.md ] && git add PREDICTIONS_TODAY.md
          [ -f F5_PREDICTIONS_TODAY.md ] && git add F5_PREDICTIONS_TODAY.md
          [ -f mlb_engine.db ] && git add mlb_engine.db
          [ -f mlb_forecasts_2026.csv ] && git add mlb_forecasts_2026.csv
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update full-game, F5 props, README, and operational database [skip ci]"
            git pull --rebase --autostash
            git push origin main
          else
            echo "No changes to commit."
          fi
