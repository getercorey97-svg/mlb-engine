name: MLB Engine Autonomous Watchdog

on:
  workflow_run:
    workflows: ["MLB Engine & Live Monitor Pipeline"]
    types: [completed]
  schedule:
    # 2:00 PM UTC (Sanity check before games commence)
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit_and_heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Autonomous Watchdog Health Audit
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WORKFLOW_STATUS: ${{ github.event.workflow_run.conclusion }}
        run: |
          python watchdog_agent.py

      - name: Purge Bytecode Cache & Clean Git Index
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          git rm -r --cached __pycache__ 2>/dev/null || true

      - name: Commit Dashboard Updates & Healed Database
        run: |
          git config --global user.name "Watchdog-AI-Agent"
          git config --global user.email "watchdog-agent@users.noreply.github.com"
          [ -f PREDICTIONS_TODAY.md ] && git add PREDICTIONS_TODAY.md
          [ -f mlb_engine.db ] && git add mlb_engine.db
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(watchdog): sync dashboard and purge cache [skip ci]"
            git pull --rebase --autostash
            git push origin main
          else
            echo "No changes detected. Skipping commit."
          fi
