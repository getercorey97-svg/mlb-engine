name: MLB Engine Backtest

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Backtest Framework
        run: python backtest_engine.py

      - name: Commit and Push Updated Database (Logs/Analysis)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mlb_engine.db
          git commit -m "Auto-update database with backtest analytics [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
