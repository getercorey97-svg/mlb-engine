name: MLB Engine Backtest & Correlation Analysis

on:
  schedule:
    # Optional weekly or daily sweep at 10:00 AM UTC
    - cron: '0 10 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-consolidated-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests scikit-learn xgboost

      - name: Purge Bytecode Cache
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true

      - name: Run Unified Backtest & Correlation Pipeline
        run: python backtest_engine.py

      - name: Commit and Push Updated Database & Analytics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          [ -f mlb_engine.db ] && git add mlb_engine.db
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update backtest ledger, models, and correlation matrix [skip ci]"
            git pull --rebase --autostash
            git push origin main
          else
            echo "No changes to commit."
          fi
