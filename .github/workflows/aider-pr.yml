name: Aider Assistant

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      instruction:
        description: 'What do you want Aider to do?'
        required: true
        type: string

jobs:
  aider_execution:
    if: >
      github.event_name == 'workflow_dispatch' || 
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/aider') && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR'))
    
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR branch (if triggered via PR comment)
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr checkout ${{ github.event.issue.number }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git for Aider
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Aider
        run: pip install aider-chat

      - name: Execute Aider with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          MANUAL_INPUT: ${{ inputs.instruction }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            INSTRUCTION="$MANUAL_INPUT"
          else
            INSTRUCTION=$(echo "$COMMENT_BODY" | sed 's/^\/aider *//')
          fi
          
          # Run Aider with strict exclusion parameters to protect all whitelisted scripts,
          # Aider configs, Dependabot, Watchdog services, and AI Fixer tools.
          aider --model gemini/gemini-3.5-flash \
                --yes \
                --exclude ".github/workflows/" \
                --exclude "dependabot.yml" \
                --exclude "aider" \
                --exclude "aifixer" \
                --exclude "ai_fixer.yml" \
                --exclude "ai_universal_fixer.py" \
                --exclude "watchdog_agent.py" \
                --exclude "engine_watchdog.py" \
                --exclude "View_predictions.py" \
                --exclude "alv_database.py" \
                --exclude "backtest_engine.py" \
                --exclude "bullpen_fatigue.py" \
                --exclude "bullpen_metrics.py" \
                --exclude "correlation_engine.py" \
                --exclude "engine.py" \
                --exclude "evolve_engine.py" \
                --exclude "export_and_odds.py" \
                --exclude "ingest_stats.py" \
                --exclude "lineup_verifier.py" \
                --exclude "map_starters.py" \
                --exclude "mlb_engine.db" \
                --exclude "mlb_forecasts_2026.csv" \
                --exclude "park_factors.py" \
                --exclude "platoon_splits.py" \
                --exclude "post_match_analysis.py" \
                --exclude "run_pipeline.py" \
                --exclude "sabermetrics.py" \
                --exclude "statcast_metrics.py" \
                --exclude "team_offense.py" \
                --exclude "umpire_tendencies.py" \
                --exclude "umpire_variance.py" \
                --exclude "weather_factors.py" \
                --message "$INSTRUCTION"
          
          git push
