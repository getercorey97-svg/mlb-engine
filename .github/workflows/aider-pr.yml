name: Aider Assistant

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      instruction:
        description: 'What do you want Aider to do?'
        required: true
        type: string

jobs:
  aider_execution:
    # Run if triggered manually OR if triggered via PR comment by an owner/collaborator
    if: >
      github.event_name == 'workflow_dispatch' || 
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/aider') && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR'))
    
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR branch (if triggered via PR comment)
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr checkout ${{ github.event.issue.number }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git for Aider
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Aider
        run: pip install aider-chat

      - name: Execute Aider with OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          MANUAL_INPUT: ${{ inputs.instruction }}
        run: |
          # Determine the instruction source based on how the workflow was triggered
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            INSTRUCTION="$MANUAL_INPUT"
          else
            INSTRUCTION=$(echo "$COMMENT_BODY" | sed 's/^\/aider *//')
          fi
          
          # Updated to use the valid current OpenRouter model slug
          aider --model openrouter/anthropic/claude-sonnet-latest --yes --message "$INSTRUCTION"
          
          git push
