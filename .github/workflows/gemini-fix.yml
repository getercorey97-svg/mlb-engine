name: fix-all-code

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  scan-and-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Scan and fix files with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.6-flash"
        run: |
          python - << 'EOF'
          import os
          import glob
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              raise ValueError("GEMINI_API_KEY environment variable is missing.")

          client = genai.Client(api_key=api_key)
          model_name = os.environ.get("GEMINI_MODEL", "gemini-3.6-flash")

          # Locate target Python files while ignoring virtual environments and hidden directories
          files_to_process = [
              f for f in glob.glob("**/*.py", recursive=True)
              if not any(part.startswith(".") or part in ("venv", "env", "site-packages") for part in f.split(os.sep))
          ]

          print(f"Found {len(files_to_process)} Python files to inspect.")

          for filepath in files_to_process:
              print(f"Processing {filepath}...")
              try:
                  with open(filepath, "r", encoding="utf-8") as f:
                      original_code = f.read()

                  prompt = (
                      "You are an automated code remediation agent. Analyze the following Python file, "
                      "fix any syntax bugs, deprecated API calls, and logic errors, and return ONLY the "
                      "fully runnable, corrected code. Do not wrap the output in markdown code fence blocks "
                      "(e.g., ```python), and do not add conversational remarks or notes.\n\n"
                      f"{original_code}"
                  )

                  response = client.models.generate_content(
                      model=model_name,
                      contents=prompt
                  )

                  fixed_code = response.text.strip()

                  # Clean code fences if the model output includes them
                  if fixed_code.startswith("```python"):
                      fixed_code = fixed_code[len("```python"):].strip()
                  elif fixed_code.startswith("```"):
                      fixed_code = fixed_code[3:].strip()

                  if fixed_code.endswith("```"):
                      fixed_code = fixed_code[:-3].strip()

                  if fixed_code and fixed_code != original_code.strip():
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(fixed_code + "\n")
                      print(f"Successfully remediated: {filepath}")
                  else:
                      print(f"No changes required for: {filepath}")

              except Exception as e:
                  print(f"Failed to process {filepath}: {e}")

          EOF

      - name: Commit and push fixes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No code changes detected."
          else
            git commit -m "Auto-remediate codebase via gemini-3.6-flash [skip ci]"
            git push
          fi
