name: Automated MLB Engine Pipeline

on:
  schedule:
    # Runs daily at 15:00 UTC (11:00 AM EDT)
    - cron: '0 15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-engine:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Required to push database updates back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run MLB Engine Pipeline
        run: python run_pipeline.py

      - name: Commit and Push Updated Database & CSV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mlb_engine.db mlb_forecasts_2026.csv
          git commit -m "Automated update: MLB database and forecasts [skip ci]" || echo "No changes to commit"
          git push

